// ── scoring engine ──────────────────────────────────────────────────────────
function effortPts(g, lbm) {
  const R = g / lbm;
  return R <= 2.5 ? 11.3 * R : 11.3 * 2.5 + (R - 2.5) * 11.3 * 0.4;
}
function streakMult(s) {
  return 1 + Math.min(0.25, 0.05 * s);
}
function dailyEarned(logged, goal, lbm, streak, social) {
  if (lbm <= 0) return 0;
  const E = effortPts(logged, lbm) * streakMult(streak);
  const A = logged >= goal && logged > 0 ? 10 : 0;
  return E + A + Math.min(3, social);
}
function bodyFatPct(s, h, w) {
  return Math.max(5, Math.min(60, (s === "M" ? 64 : 76) - 20 * (h / w)));
}
function leanKg(s, wLb, h, w) {
  return wLb * 0.4536 * (1 - bodyFatPct(s, h, w) / 100);
}

// ── rank system ─────────────────────────────────────────────────────────────
function getRank(pts) {
  if (pts >= 200) return {
    title: "Chief",
    emoji: "👮",
    color: C.gold,
    bg: C.amberSoft
  };
  if (pts >= 150) return {
    title: "Lieutenant",
    emoji: "🎖️",
    color: "#7C3AED",
    bg: "#F3F0FF"
  };
  if (pts >= 110) return {
    title: "Sergeant",
    emoji: "⭐",
    color: C.blue,
    bg: C.blueSoft
  };
  if (pts >= 70) return {
    title: "Detective",
    emoji: "🔍",
    color: C.green,
    bg: C.greenSoft
  };
  if (pts >= 35) return {
    title: "Patrol Officer",

    bg: C.paper

  return {

}

function launchConfetti() {
  const colors = ['#2B5CF0', '#5B53E8', '#11BE73', '#FFD66E', '#FB3B53', '#F5A623'];
  for (let i = 0; i < 70; i++) {
    const el = document.createElement('div');
    const size = 6 + Math.random() * 8;
    el.style.cssText = `position:fixed;width:${size}px;height:${size}px;background:${colors[i % colors.length]};
      left:${10 + Math.random() * 80}%;top:-14px;border-radius:${Math.random() > 0.5 ? '50%' : '2px'};
      animation:ppConfetti ${1.8 + Math.random() * 1.8}s ease-in forwards;
      animation-delay:${Math.random() * 0.6}s;z-index:9999;pointer-events:none;
      transform:rotate(${Math.random() * 360}deg)`;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 4500);
  }
}

function playSiren() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator(),
      gain = ctx.createGain();
    osc.type = "sine";
    osc.connect(gain);
    gain.connect(ctx.destination);
    const t = ctx.currentTime;
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.15, t + 0.05);
    let time = t;
    for (let i = 0; i < 4; i++) {
      osc.frequency.setValueAtTime(660, time);
      osc.frequency.linearRampToValueAtTime(1040, time + 0.28);
      osc.frequency.linearRampToValueAtTime(660, time + 0.56);
      time += 0.56;
    }
    gain.gain.exponentialRampToValueAtTime(0.0001, time);
    osc.start(t);
    osc.stop(time + 0.05);
    osc.onended = () => ctx.close();
  } catch (e) {}

// ── standings ────────────────────────────────────────────────────────────────
function getStandings(earnedRounded) {
  const base = 84;
  const friends = [{
    name: "Omar K",
    pts: 138,
    color: "#7C3AED"
  }, {
    name: "Sara M",
    pts: 99,
    color: "#0EA5E9"
  }, {
    name: "Mike R",
    pts: 80,
    color: "#F59E0B"
  }, {
    name: "Lena P",
    pts: 61,
    color: "#EC4899"
  }];
  const youTotal = base + earnedRounded;
  const all = [...friends, {
    name: "You",
    pts: youTotal,
    you: true
  }].sort((a, b) => b.pts - a.pts);
  const youRank = all.findIndex(p => p.you) + 1;
  const passed = friends.filter(f => f.pts >= base && f.pts < youTotal).map(f => f.name);
  const above = friends.filter(f => f.pts > youTotal).sort((a, b) => a.pts - b.pts)[0];
  const below = friends.filter(f => f.pts < youTotal).sort((a, b) => b.pts - a.pts)[0];
  const events = [];
  passed.forEach(n => events.push({
    icon: "up",
    color: C.green,
    bg: C.greenSoft,
    text: `You collared ${n}!`
  }));
  if (above) {
    const d = above.pts - youTotal;
    events.push(d > 25 ? {
      icon: "flame",
      color: C.red,
      bg: C.redSoft,
      text: `${above.name} has you on the run — ${d} pts ahead`
    } : {
      icon: "zap",
      color: C.blue,
      bg: C.blueSoft,
      text: `${above.name} is ${d} pts ahead — close in`
    });
  }
  if (below) {
    const d = youTotal - below.pts;
    if (d <= 12) events.push({
      icon: "siren",
      color: C.amber,
      bg: C.amberSoft,
      text: `${below.name} is tailing you — only ${d} back`
    });
  }
  return {
    all,
    youRank,
    youTotal,
    above,
    events
  };
}
